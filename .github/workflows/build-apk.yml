name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Secrets가 없을 때 쓰는 디버그 키를 빌드 간에 재사용(업데이트 설치 유지용 · 7일 미사용 시 만료)
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      # 서명키: Secrets에 ANDROID_KEYSTORE_BASE64 등이 있으면 고정 키로 서명
      - name: 서명키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::서명키 Secrets가 없어 디버그 키로 서명합니다(업데이트 설치 시 기존 앱 삭제 필요)."
          fi

      # 빌드 번호를 매번 올려야 폰에서 「업데이트」로 설치됨
      - name: APK 빌드
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk workout-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-apk
          path: workout-tracker.apk

      - name: 릴리스에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 운동기록 v1.0.${{ github.run_number }}
          body: |
            폰에서 아래 workout-tracker.apk 를 눌러 받은 뒤 설치하세요.
            커밋: ${{ github.sha }}
          files: workout-tracker.apk
          make_latest: true
